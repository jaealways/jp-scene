<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>한 장면 더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style id="app-css">
/* 하루 디자인 v4 토큰 사본(정본: 디자인 시스템 「하루 디자인」) · 3판 2026-11-20 커리큘럼 신호 */
:root{color-scheme:dark;--bg:#17171C;--card:#222228;--band:#2A2A31;--line:#2E2E35;--ink:#EAEBEE;--ink2:#C3C8CE;--ink3:#9BA2AB;--accent:#4593FC;--accent-ink:#7CB2FF;--accent-soft:#132A42;--fill:#1B64DA;--pos:#1FC77E;--pos-soft:#0F2B21;--warn:#FFB020;--fs-0:40px;--fs-1:26px;--fs-2:20px;--fs-3:18px;--fs-4:16px;--fs-5:15px;--r-card:20px;--r-face:16px;--r-chip:7px;--r-pill:999px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:var(--fs-4);line-height:1.55;letter-spacing:-.01em;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.page{max-width:620px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
.vid{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1*max(20px,env(safe-area-inset-left)));padding-top:env(safe-area-inset-top)}
.vid .box{position:relative;aspect-ratio:16/9;background:#000;max-height:42vh;margin:0 auto}
.vid .box>#yt,.vid .box>iframe{position:absolute;inset:0;width:100%;height:100%}
.topbar{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 20px}
.topbar button{min-height:44px;font-size:var(--fs-5);font-weight:500;color:var(--ink3);padding:0}
.topbar span{font-size:var(--fs-5);color:var(--ink3);margin-left:auto}
body.list .box{display:none}
.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--card);border-radius:var(--r-card);padding:var(--s4) var(--s5);margin-bottom:var(--s2)}
.lrow .tx{flex:1;min-width:0}.lrow b{display:block;font-size:var(--fs-4)}.lrow em{display:block;font-style:normal;font-size:var(--fs-5);color:var(--ink3)}
.lchip{flex:none;font-size:var(--fs-5);padding:4px 10px;border-radius:var(--r-pill);background:var(--band);color:var(--ink2)}
.lchip.due{background:#33280F;color:var(--warn)}.lchip.ok{background:var(--pos-soft);color:var(--pos)}.lchip.go{background:var(--accent-soft);color:var(--accent-ink)}
.sec{font-size:var(--fs-3);font-weight:700;margin:var(--s5) 0 var(--s3)}
.cover{position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(23,23,28,.92);display:none;align-items:center;justify-content:center;color:var(--ink3);font-size:var(--fs-5);pointer-events:none}
.cover.on{display:flex}
.hd{margin:var(--s4) 0 var(--s2)}
.title{font-size:var(--fs-3);font-weight:700;margin:0}
.asof{font-size:var(--fs-5);color:var(--ink3);margin:2px 0 0}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--s5)}
.btn{min-height:56px;border-radius:var(--r-face);background:var(--band);font-size:var(--fs-4);font-weight:600;padding:0 var(--s4)}
.btn.pri{background:var(--fill);color:#fff}
.btn.sm{min-height:48px}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.wide{width:100%}
.step-h{font-size:var(--fs-5);color:var(--ink3);margin:0 0 var(--s2)}
.big{font-size:var(--fs-2);font-weight:700;margin:0 0 var(--s2)}
.sub{font-size:var(--fs-5);color:var(--ink3);margin:var(--s2) 0 0}
.gap{height:var(--s3)}
/* 문장 화면 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin:var(--s3) 0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--band)}
.dots i.ok{background:var(--pos)}.dots i.again{background:var(--warn)}
.dots i.on{background:var(--accent);transform:scale(1.3)}
.auto{display:flex;align-items:center;gap:var(--s2);min-height:44px;font-size:var(--fs-5);color:var(--ink2)}
.auto .sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--band);position:relative;flex:none}
.auto .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink3);transition:left .2s}
.auto.on .sw{background:var(--fill)}.auto.on .sw::after{left:21px;background:#fff}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.chip{min-height:40px;padding:0 var(--s4);border-radius:var(--r-pill);background:var(--band);font-size:var(--fs-5);color:var(--ink2)}
.chip.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink3);text-decoration:line-through}
.no{font-size:var(--fs-5);color:var(--ink3);display:flex;justify-content:space-between}
.ja{font-size:var(--fs-1);font-weight:600;line-height:2.1;margin:var(--s2) 0 0;word-break:keep-all;overflow-wrap:anywhere}
.ja ruby{ruby-align:center}.ja rt{font-size:var(--fs-5);font-weight:400;color:var(--ink3);letter-spacing:-.08em}
.ja.nofu rt{visibility:hidden}
.ja rt{font-size:var(--fs-5)}
.ja .s-known rt{display:none}
.ja .s-target{color:var(--warn)}
.ja .s-target rt{color:var(--warn);font-weight:600}
.ja .s-later rt{color:var(--ink3)}
.orig{font-size:var(--fs-4);color:var(--ink3);margin-top:var(--s1);line-height:1.9}
.orig rt{font-size:12px}
.wk{font-size:var(--fs-5);color:var(--ink2);margin:0 0 var(--s2)}
.wk b{color:var(--warn);letter-spacing:.15em}
.ja .u{transition:color .12s;border-radius:4px}
.ja .u.lit{color:var(--accent-ink)}
.ja .kt{box-shadow:inset 0 -2px 0 var(--warn)}
.ja.tap .k{cursor:pointer}
.ja.hide{background:var(--accent-soft);color:transparent;border-radius:var(--r-chip)}
.ja.hide rt,.ja.hide .u.lit{color:transparent}
.ro{font-size:var(--fs-4);color:var(--ink2);margin-top:var(--s1)}
.ko{font-size:var(--fs-3);margin-top:var(--s2)}
.mask{background:var(--accent-soft);color:transparent!important;border-radius:var(--r-chip);cursor:pointer}
.tip{position:fixed;z-index:20;transform:translate(-50%,-110%);background:var(--ink);color:var(--bg);font-size:var(--fs-3);font-weight:700;padding:6px 12px;border-radius:var(--r-chip);pointer-events:none;white-space:nowrap}
.pre{font-size:var(--fs-5);color:var(--accent-ink);margin-top:var(--s3);min-height:24px}
.ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:var(--s2);margin:var(--s3) 0 var(--s2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.btn.sel-ok{background:#0B7A4E;color:#fff}.btn.sel-again{background:#5A4410;color:#fff}
details{background:var(--card);border-radius:var(--r-card);padding:var(--s4) var(--s5)}
summary{font-weight:600;cursor:pointer;min-height:24px}
.ex .k2{display:block;font-size:var(--fs-5);color:var(--ink3);margin:var(--s3) 0 var(--s1)}
.ex p{margin:0}
.ex rt{font-size:var(--fs-5);color:var(--ink3)}
.wd{display:flex;flex-direction:column;gap:var(--s2)}
.wd button{text-align:left;min-height:48px;padding:var(--s2) var(--s3);border-radius:var(--r-face);background:var(--band);font-size:var(--fs-4)}
.wd button.on{background:var(--pos-soft);color:var(--pos)}
.wd button em{font-style:normal;font-size:var(--fs-5);color:var(--ink3);margin-left:var(--s2)}
.wd button.on em{color:var(--pos)}
/* 끝 화면 */
.kana{font-size:72px;font-weight:700;text-align:center;line-height:1.2;margin:var(--s3) 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.opts .btn.right{background:#0B7A4E;color:#fff}.opts .btn.wrong{opacity:.4}
.cnt{font-size:var(--fs-0);font-weight:700;margin:var(--s2) 0}
.note{font-size:var(--fs-5);color:var(--ink3);margin:var(--s4) 0}
.err{background:var(--card);border-radius:var(--r-card);padding:var(--s5);display:none;margin-top:var(--s3)}
.err a{color:var(--accent-ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="vid"><div class="topbar"><button id="back" type="button">‹ 일본어</button><span id="tbn"></span></div><div class="box"><div id="yt"></div><div class="cover" id="cover">자막 가림</div></div></div>
<div class="page">
 <div class="hd"><h1 class="title" id="vt"></h1><p class="asof" id="vs"></p></div>

 <section id="p-list" hidden></section>

 <!-- 1 시작 -->
 <section id="p-intro">
  <div class="card">
   <p class="step-h">처음엔 그냥 봐요</p>
   <p class="big">장면을 한 번 쭉 보고 문장으로 들어가요</p>
   <p class="sub" id="dueNote" hidden></p>
   <div id="warmBox" hidden><div class="gap"></div><button class="btn wide" id="warm">⟲ 지난번 그 말 먼저 듣기 · 30초</button><div class="ja" id="warmJa" style="font-size:var(--fs-2)"></div></div>
   <div class="gap"></div>
   <button class="btn pri wide" id="whole">▶ 장면 한 번 쭉 보기</button>
   <div class="gap"></div>
   <button class="btn wide" id="skip">바로 문장으로 ›</button>
  </div>
 </section>

 <!-- 2 문장 -->
 <section id="p-lines" hidden>
  <p class="wk" id="wk"></p>
  <div class="bar"><div class="dots" id="dots"></div><button class="auto" id="auto" aria-pressed="false"><span class="sw"></span>지하철 자동</button></div>
  <div class="chips" id="chips">
   <button class="chip" data-h="ko">뜻</button>
   <button class="chip" data-h="ro">로마자</button>
   <button class="chip" data-h="fu">한자</button>
  </div>
  <div class="card" id="cur">
   <div class="no"><span id="no"></span><span id="mark"></span></div>
   <div class="ja" id="ja"></div>
   <div class="orig" id="orig"></div>
   <div class="ro" id="ro"></div>
   <div class="ko" id="ko"></div>
   <div class="pre" id="pre"></div>
  </div>
  <div class="ctl">
   <button class="btn" id="prev">‹ 이전</button>
   <button class="btn pri" id="play">⟲ 다시 듣기</button>
   <button class="btn" id="next">다음 ›</button>
  </div>
  <div class="row2"><button class="btn sm" id="less">한 단계 줄이기 ▸</button><button class="btn sm" id="more">◂ 다시 보이기</button></div>
  <div class="row2"><button class="btn sm" id="ok">입에 붙었어</button><button class="btn sm" id="again">다시 볼래</button></div>
  <details id="exd"><summary>이 문장 뜯어보기</summary><div class="ex"><span class="k2">낱말 · 누르면 담아 둬요(1·3·7일 뒤 이 문장부터)</span><div class="wd" id="w"></div><span class="k2">말의 틀</span><p id="pt"></p></div></details>
  <p class="note">⟲는 다시 듣기만 해요. 글자는 위 칩이나 「한 단계 줄이기」로 내가 정해요. 로마자를 끄면 모르는 가나를 눌러 보세요. 노란 밑줄은 외래어(가타카나) 낱말이에요. 글자 불빛은 소리에 맞춘 어림값이에요.</p>
 </section>

 <!-- 3 장면 끝 -->
 <section id="p-end" hidden>
  <div class="card" id="endCard"></div>
 </section>

 <div class="err" id="err">영상이 이 화면에서 안 열려요. <a id="errlink" href="#">유튜브에서 그 시각으로 보기</a></div>
</div>

 fetch(ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ev})})
 .then(()=>{st.q=st.q.slice(ev.length);save()}).catch(()=>{}).finally(()=>{flushing=false})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
const strOf=i=>st.str[i]||0;
function bump(i,d){st.str[i]=Math.max(0,Math.min(4,strOf(i)+d))}
st.visits++; st.hide.ja=false; logEv('visit',-1,'visits',st.visits); save();
$('vt').textContent=S.t; $('vs').textContent=S.s;

/* 플레이어 */
let player=null,ready=false,endAt=null,onEnd=null,segA=0,segB=0,litOn=false;
function seg(a,b,cb){if(!ready)return;segA=a;segB=b;endAt=b;onEnd=cb||null;player.seekTo(a,true);player.playVideo();}
function stopSeg(){endAt=null;onEnd=null;litOn=false;clearLit();try{player.pauseVideo()}catch(e){}}
setInterval(()=>{if(!ready||endAt===null||!player.getCurrentTime)return;const t=player.getCurrentTime();
 if(litOn)lit((t-segA)/(segB-segA));
 if(t>=endAt){player.pauseVideo();endAt=null;litOn=false;clearLit();const f=onEnd;onEnd=null;if(f)setTimeout(f,50)}},80);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:vidId,playerVars:{playsinline:1,rel:0,modestbranding:1,start:S.a,cc_load_policy:0},events:{onReady:()=>{ready=true;window.__ready=true},onError:()=>{$('err').style.display='block'}}})};
const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 화면 전환 */
function show(p){['intro','lines','end'].forEach(x=>$('p-'+x).hidden=x!==p);window.scrollTo(0,0)}

/* 1 시작 */
const now=Date.now();
const dueLines=[...new Set(Object.entries(st.due).filter(([k,v])=>v<=now).map(([k])=>+k))].sort((a,b)=>a-b);
if(dueLines.length){$('dueNote').hidden=false;$('dueNote').textContent=`담아 둔 말이 든 문장 ${dueLines.length}개부터 시작해요`;st.i=dueLines[0]}
/* 지난번 약했던 말 2개 먼저(원래 영상 소리) */
const weak=Object.keys(st.seen||{}).map(Number).filter(i=>strOf(i)<=1).sort((a,b)=>strOf(a)-strOf(b)||a-b).slice(0,2);
if(st.visits>=2&&weak.length){$('warmBox').hidden=false}
$('warm').onclick=async()=>{for(const i of weak){const l=L[i];$('warmJa').innerHTML=rubyHtml(l[2])+`<div class="ko" style="font-size:var(--fs-4)">${l[4]}</div>`;await new Promise(r=>seg(Math.max(0,l[0]-0.15),l[1]+0.25,r));await sleep(1500)}$('warmJa').innerHTML='';$('warmBox').hidden=true;logEv('warm',-1,'lines',weak.join(' '))};
$('whole').onclick=()=>{if(endAt!==null){stopSeg();toLines();return}$('whole').textContent='보는 중 · 누르면 건너뛰기';setCover(false);seg(S.a,S.b,toLines)};
$('skip').onclick=()=>{stopSeg();toLines()};
function toLines(){$('whole').textContent='▶ 장면 한 번 쭉 보기';show('lines');plays=0;autoHide();save();render()}

/* 2 문장 */
let plays=0,auto=false,autoTok=0,preTimer=null;
const ORDER=['ko','ro','fu','ja'];
function setCover(on){$('cover').classList.toggle('on',on)}
function applyHide(){const h=st.hide;
 $('ko').classList.toggle('mask',h.ko);$('ro').hidden=h.ro;
 $('orig').hidden=h.fu;$('ja').classList.toggle('hide',h.ja);$('ja').classList.toggle('tap',h.ro&&!h.ja);
 document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('off',h[c.dataset.h]));
 setCover(h.ja);
 const lv=ORDER.filter(k=>h[k]).length;$('less').disabled=lv===4;$('more').disabled=lv===0;
}
function render(){const l=L[st.i];
 $('no').textContent=(st.i+1)+' / '+L.length;
 $('mark').textContent=st.m[st.i]==='ok'?'입에 붙음':st.m[st.i]==='again'?'다시 볼 말':'';
 $('ja').innerHTML=kanaHtml(l[2]);$('orig').innerHTML=rubyHtml(l[2]);$('wk').innerHTML=`이번 주 글자 <b>${kWeekChars()}</b> · 노란 글자만 로마자가 붙어요`;$('ro').textContent=l[3];$('ko').textContent=l[4];$('pre').textContent=auto?'지하철 자동 · 듣고 3초 따라 하고 한 번 더':'';
 $('w').innerHTML=l[5].map(([w,m])=>`<button data-wd="${plain(w)}" class="${st.saved[plain(w)]?'on':''}"><span>${rubyHtml(w)}</span><em>${m}${st.saved[plain(w)]?' · 담음':''}</em></button>`).join('');
 $('pt').textContent=l[6];
 $('dots').innerHTML=L.map((_,k)=>`<i class="${k===st.i?'on':''} ${st.m[k]||''}"></i>`).join('');
 $('prev').disabled=st.i===0;$('next').textContent=st.i===L.length-1?'마무리 ›':'다음 ›';
 $('ok').classList.toggle('sel-ok',st.m[st.i]==='ok');$('again').classList.toggle('sel-again',st.m[st.i]==='again');
 $('errlink').href=`https://www.youtube.com/watch?v=${vidId}&t=${Math.floor(l[0])}s`;
 applyHide();
}
/* 노래방 불빛 */
function lit(p){const us=[...$('ja').querySelectorAll('.u')];if(!us.length)return;const tot=us.reduce((a,u)=>a+(+u.dataset.w||1),0);let acc=0;const lim=Math.max(0,Math.min(1,p))*tot;us.forEach(u=>{acc+=(+u.dataset.w||1);u.classList.toggle('lit',acc<=lim+0.5)})}
function clearLit(){document.querySelectorAll('#ja .u.lit').forEach(u=>u.classList.remove('lit'))}
function playLine(cb){const l=L[st.i];litOn=true;seg(Math.max(0,l[0]-0.15),l[1]+0.25,cb)}
$('play').onclick=()=>{stopAuto();clearTimeout(preTimer);
 if(plays===0&&!st.hide.ja&&$('ja').querySelector('.s-target')){let n=3;$('pre').textContent=`노란 글자 먼저 읽어 봐요 · ${n}`;
  const tick=()=>{n--;if(n>0){$('pre').textContent=`노란 글자 먼저 읽어 봐요 · ${n}`;preTimer=setTimeout(tick,1000)}else{$('pre').textContent='';plays++;playLine()}};preTimer=setTimeout(tick,1000);return}
 plays++;playLine()};
let lineTaps=0;
function leaveLine(){const i=st.i;if(!plays&&!lineTaps)return;const lv=ORDER.filter(x=>st.hide[x]).length;
 if(!auto){if(plays>=4||(lineTaps>=2&&lv<2))bump(i,-1);else if(lv>=2&&plays<=2)bump(i,1);}
 st.seen=Object.assign({},st.seen,{[i]:1});logEv('line',i,'plays',plays,`hide=${lv};taps=${lineTaps};str=${strOf(i)}`);lineTaps=0}
function autoHide(){const s=strOf(st.i);st.hide={ko:s>=2,ro:true,fu:s>=3,ja:false}}
function go(k){stopSeg();clearTimeout(preTimer);leaveLine();flush();
 if(k>=L.length){toEnd();return}
 st.i=Math.max(0,k);plays=0;autoHide();
 if(st.due[st.i]&&st.due[st.i]<=Date.now()){const b=(st.dueBox||{})[st.i]||0;st.dueBox=Object.assign({},st.dueBox,{[st.i]:b+1});st.due[st.i]=Date.now()+IV[Math.min(b+1,4)]*DAY}
 save();$('exd').open=false;render()}
$('prev').onclick=()=>{stopAuto();go(st.i-1)};
$('next').onclick=()=>{stopAuto();go(st.i+1)};
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;st.hide[c.dataset.h]=!st.hide[c.dataset.h];save();applyHide()};
$('less').onclick=()=>{const k=ORDER.find(k=>!st.hide[k]);if(k){st.hide[k]=true;save();applyHide()}};
$('more').onclick=()=>{const k=[...ORDER].reverse().find(k=>st.hide[k]);if(k){st.hide[k]=false;save();applyHide()}};
$('ok').onclick=()=>{st.m[st.i]='ok';delete st.due[st.i];bump(st.i,1);logEv('mark',st.i,'ok',strOf(st.i));save();render()};
$('again').onclick=()=>{st.m[st.i]='again';st.due[st.i]=Date.now()+DAY;st.str[st.i]=0;logEv('mark',st.i,'again',0);save();render()};
$('w').onclick=e=>{const b=e.target.closest('[data-wd]');if(!b)return;const w=b.dataset.wd;
 if(st.saved[w]){delete st.saved[w];logEv('word',st.i,w,0)}else{st.saved[w]={line:st.i,at:Date.now()};if(!st.due[st.i])st.due[st.i]=Date.now()+DAY;logEv('word',st.i,w,1)}save();render();$('exd').open=true};
/* 가린 칸 잠깐 보기 */
document.addEventListener('click',e=>{const m=e.target.closest('.mask');if(m){m.classList.remove('mask');setTimeout(applyHide,2500);return}
 if(e.target.closest('#ja.hide')){$('ja').classList.remove('hide');setTimeout(applyHide,2500);return}});
/* 가나 누르기 → 로마자 */
let tipEl=null;
$('ja').addEventListener('click',e=>{if(st.hide.ja)return;const kt=e.target.closest('.kt');const u=e.target.closest('.k');if(!u&&!kt)return;
 const target=kt||u;const r=target.dataset.r||u.dataset.r;const key=kt?kt.textContent:(u.firstChild.nodeValue||u.textContent);
 lineTaps++;[...key].filter(c=>/[ぁ-ゖァ-ヶ]/.test(c)&&!'ゃゅょぁぃぅぇぉっャュョァィゥェォッ'.includes(c)).forEach(c=>{st.taps[c]=(st.taps[c]||0)+1;st.ks[c]=(st.ks[c]||0)-1});logEv('kana',st.i,key,r);save();kTap(key);
 const rc=target.getBoundingClientRect();if(tipEl)tipEl.remove();tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent=r;tipEl.style.left=(rc.left+rc.width/2)+'px';tipEl.style.top=rc.top+'px';document.body.appendChild(tipEl);const me=tipEl;setTimeout(()=>me.remove(),1400)});
/* 카드 밀기 */
let x0=null;$('cur').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('cur').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){stopAuto();go(st.i+(dx<0?1:-1))}});
/* 지하철 자동 */
function stopAuto(){if(!auto)return;auto=false;autoTok++;$('auto').classList.remove('on');$('auto').setAttribute('aria-pressed','false');$('pre').textContent=''}
const playP=()=>new Promise(r=>{playLine(r)});
async function runAuto(tok){
 while(auto&&tok===autoTok){
  const s=strOf(st.i),reps=s<=1?3:s===2?2:1;
  for(let rep=0;rep<reps;rep++){if(tok!==autoTok)return;plays++;$('pre').textContent=`지하철 자동 · ${rep===0?'듣기':'한 번 더'} ${rep+1}/${reps}`;await playP();if(tok!==autoTok)return;$('pre').textContent='지하철 자동 · 속으로 따라 하기 3초';await sleep(3000)}
  if(tok!==autoTok)return;
  if(st.i>=L.length-1){stopAuto();toEnd();return}
  go(st.i+1)}
}
$('auto').onclick=()=>{if(auto){stopAuto();stopSeg();return}auto=true;autoTok++;$('auto').classList.add('on');$('auto').setAttribute('aria-pressed','true');clearTimeout(preTimer);stopSeg();runAuto(autoTok)};

/* 3 장면 끝: 글자 3개 → 떠올리기 → 자막 없이 쭉 → 끝 */
let endQ=[],eStep=0,eIdx=0;
function sceneKana(){const c={};L.forEach(l=>{[...plain(l[2])].forEach(ch=>{if(/[ぁ-ゖァ-ヶ]/.test(ch)&&!'ゃゅょぁぃぅぇぉっャュョァィゥェォッをん'.includes(ch))c[ch]=(c[ch]||0)+1})});return c}
function pickKana(){const tapped=Object.entries(st.ks).filter(x=>x[1]<0).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);const all=Object.keys(sceneKana());const tgt=all.filter(k=>kState(k)==='target');const out=[...new Set(tapped.concat(tgt.sort(()=>Math.random()-.5)))].slice(0,3);for(const k of all.sort(()=>Math.random()-.5)){if(out.length>=3)break;if(!out.includes(k))out.push(k)}return {out,all,fromTap:tapped.length>0}}
function toEnd(){stopSeg();setCover(false);logEv("end",-1,"ok",L.filter((_,k)=>st.m[k]==="ok").length);flush();const p=pickKana();endQ=p.out;window.__kpool=p.all;eStep=0;eIdx=0;show('end');renderEnd()}
function renderEnd(){const c=$('endCard');
 if(eStep===0){const k=endQ[eIdx];const right=romUnit(k);const pool=[...new Set(window.__kpool.map(romUnit))].filter(r=>r!==right).sort(()=>Math.random()-.5).slice(0,3);const opts=[right,...pool].sort(()=>Math.random()-.5);
  c.innerHTML=`<p class="step-h">마무리 1 · 오늘의 글자 ${eIdx+1} / ${endQ.length}</p><p class="big">이 글자, 어떻게 읽어요?</p><div class="kana">${k}</div><div class="opts">${opts.map(o=>`<button class="btn" data-o="${o}">${o}</button>`).join('')}</div><div class="gap"></div><button class="btn wide" id="eNext" hidden>다음 ›</button>`;
  c.querySelector('.opts').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const okk=b.dataset.o===right;st.ks[k]=okk?Math.min(2,(st.ks[k]||0)+1):Math.min(-1,(st.ks[k]||0)-1);kQuiz(k,okk);logEv('quiz',-1,k,okk?1:0,b.dataset.o);save();c.querySelectorAll('[data-o]').forEach(x=>{x.classList.add(x.dataset.o===right?'right':'wrong');x.disabled=true});$('eNext').hidden=false};
  $('eNext').onclick=()=>{eIdx++;if(eIdx>=endQ.length){eStep=1;eIdx=0}renderEnd()};return}
 if(eStep===1){const ag=L.map((_,k)=>k).filter(k=>st.m[k]==='again');if(!ag.length){eStep=2;renderEnd();return}
  const k=ag[eIdx];const l=L[k];
  c.innerHTML=`<p class="step-h">마무리 2 · 다시 볼 말 떠올리기 ${eIdx+1} / ${ag.length}</p><p class="big">${l[4]}</p><p class="sub">이 뜻을 일본어로 속으로 말해 봐요</p><div class="ja" id="eja" style="visibility:hidden">${rubyHtml(l[2])}</div><div class="gap"></div><button class="btn pri wide" id="eChk">원래 목소리로 맞춰 보기</button><div class="opts" id="eGrade" style="grid-template-columns:1fr 1fr 1fr;margin-top:var(--s3)" hidden><button class="btn" data-g="2">바로</button><button class="btn" data-g="1">겨우</button><button class="btn" data-g="0">안 떠올랐어</button></div>`;
  $('eChk').onclick=()=>{$('eja').style.visibility='visible';$('eGrade').hidden=false;seg(Math.max(0,l[0]-0.15),l[1]+0.25)};
  $('eGrade').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=+b.dataset.g;
   if(g===2){bump(k,1);const bx=Math.min(4,((st.dueBox||{})[k]||0)+1);st.dueBox=Object.assign({},st.dueBox,{[k]:bx});st.due[k]=Date.now()+IV[bx]*DAY}
   else if(g===1){st.due[k]=Date.now()+DAY}
   else{st.str[k]=0;st.dueBox=Object.assign({},st.dueBox,{[k]:0});st.due[k]=Date.now()+DAY}
   logEv('recall',k,'grade',g);save();stopSeg();eIdx++;if(eIdx>=ag.length){eStep=2;eIdx=0}renderEnd()};return}
 if(eStep===2){c.innerHTML=`<p class="step-h">마무리 3 · 자막 없이</p><p class="big">이제 장면을 자막 없이 다시 쭉 봐요</p><p class="sub">처음보다 들리는 말이 늘었는지 느껴 봐요</p><div class="gap"></div><button class="btn pri wide" id="eWhole">▶ 자막 없이 쭉 보기</button><div class="gap"></div><button class="btn wide" id="eNext">건너뛰기 ›</button>`;
  $('eWhole').onclick=()=>{setCover(true);$('eWhole').textContent='보는 중';seg(S.a,S.b,()=>{setCover(false);eStep=3;renderEnd()})};
  $('eNext').onclick=()=>{stopSeg();setCover(false);eStep=3;renderEnd()};return}
 const ok=L.filter((_,k)=>st.m[k]==='ok').length;const saved=Object.keys(st.saved).length;
 c.innerHTML=`<p class="step-h">끝</p><p class="big">입에 붙은 문장</p><div class="cnt">${ok}<span style="font-size:var(--fs-3);color:var(--ink3)"> / ${L.length}개</span></div><p class="sub">${saved?`담아 둔 말 ${saved}개는 내일부터 이 장면을 열면 먼저 나와요`:'다시 볼 말은 내일 이 장면을 열면 먼저 나와요'}</p><div class="gap"></div><button class="btn pri wide" id="eAgain">문장으로 돌아가기</button><div class="gap"></div><button class="btn wide" id="eTop">처음부터</button>`;
 $('eAgain').onclick=()=>{show('lines');go(0)};$('eTop').onclick=()=>{st.i=0;save();show('intro')};
}
render();
window.__scene={L,st,get plays(){return plays},get player(){return player},get auto(){return auto},romWord,lineHtml};
}
}
</script>
</body>
</html>
